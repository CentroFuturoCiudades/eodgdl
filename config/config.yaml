# The processing's run parameters (docs/pipeline.md): what a run chooses, in one file. eodgdl reads the two weights from
# it (eodgdl.config) and the workflow (workflow/Snakefile) reads it all. What defines a model stays beside it: seeds,
# grids and the pipeline tasha's draws in src/eodgdl/impute/{tasks,chains,pipelines}/.
# A change here is a change to the processing: commit it with what it produced (every manifest records the commit, and
# whether the clone was dirty).

# The imputations' weight: the weight of every EOD source's rows (the survey's tasks train and are evaluated on it;
# src/eodgdl/impute/sources/eod.yaml, `run_weights`, says what each name reads):
#   design  the survey's own: each table's `ponderador` (reports/expansion_factors.qmd). The delivery's, since
#           2026-10-08: the imputations do not wait for the reweighting, and the employment the TMG weight is fitted
#           on (stage 1) is the employment the TASHA tables draw from.
#   tmg     TMG.SurveyReweight's household weight, data/EOD_peso_hogar_TMG.csv (`eodgdl reweight import-weight`): a
#           sensitivity run only, into another root (`snakemake --config output=ROOT`, then scripts/impute/parity.py)
weight: design

# The TASHA tables' expansion weight, their ExpansionFactor (src/eodgdl/tasha/mappings.yaml), the one place the
# reweighting enters them:
#   design  each table's own `ponderador` (dwellings, persons, trips)
#   tmg     TMG.SurveyReweight's household weight on every table (a person and a trip carry their household's); the
#           TASHA build waits for the weight and its check (rule tmg_weight), and only it reruns when the weight changes
expansion: design

# Stage 4: the bootstrap refits of every task (`eodgdl impute retrain --bootstrap B`); draw d of a chain or of the
# pipeline tasha reads bootstrap bundle d mod B.
bootstrap: 50

# The multiple imputations of the diagnostic chains scored alone (`eodgdl impute score <chain> --draws M --bootstrap`,
# <root>/<chain>/multiple_imputation/, read by their evaluations' Rubin's rules).
draws: 50

# Stage 6: the completed dataset of the pipeline tasha the TASHA build reads (`eodgdl tasha build --draw`).
draw: 0
