# Imputation task: the economic activity (`giro_empresa`) of the EOD workers who did not report it. Trained and
# scored within the survey on its own workers (source `eod.workers`, see sources/eod.yaml); read by
# eodgdl.impute.spec. Everything the engine needs to build, select, evaluate and score the model is here: target
# classes, features, declared levels, feature arms, the auxiliary destination model, the candidate grid and the
# evaluation settings, plus the configuration of giro's DENUE feature builder.

task: giro
source: eod.workers
bundle: od_giro_hybrid_model.joblib   # data file of the fitted bundle (eodgdl.data.resolve)

target:
  column: giro_empresa                # survey labels; the models are trained on the slugs (column `giro`)
  classes:                            # label -> slug; order = output order (prob_giro_<slug>)
    Comercio: comercio
    Servicio: servicio
    Educación: educacion
    Industria: industria
    Gobierno/sector público: gobierno

missing_label: no_especificado        # given to missing categorical values inside the pipelines
missing_values:                       # answers that count as unobserved, besides NA / blank / the missing label
  escolaridad: ["No sabe"]

features:
  # Built on top of the source frame, in this order (each sees the columns of the ones before it).
  builders: [eod.work_trip, giro.destination]
  groups:
    # Person and dwelling attributes (eodgdl names). `edad` is numeric; everything else categorical.
    person: [sexo_nacimiento, edad, escolaridad, municipio, estado_civil, parentesco, personas_en_vivienda, ocupacion,
             trabajo_semana_pasada, centralidad]
    # Work-trip destination: its type, its ámbito and the DENUE establishment mix of the destination's unit in the
    # zone system (an urban or rural AGEB), one share per giro.
    destination: [destino_trabajo, destino_ambito, dest_establecimientos_log, dest_share_grandes, dest_share_comercio,
                  dest_share_servicio, dest_share_educacion, dest_share_industria, dest_share_gobierno]
    # Mode of the work trip, weekend work destination, household vehicles.
    mobility: [modo_trabajo, weekend_dest_trabajar, n_autos_camionetas]
  numeric: [edad, dest_establecimientos_log, dest_share_grandes, dest_share_comercio, dest_share_servicio,
            dest_share_educacion, dest_share_industria, dest_share_gobierno]

levels:
  # Every level a categorical feature can take (the missing label is appended): declared here, or else the eodgdl
  # schema's levels of the source column named in `schema_columns` (default: the feature's own name).
  declared:
    destino_ambito: [ageb_urbana, ageb_rural, aeropuerto, fuera_zm, desconocido]
    weekend_dest_trabajar: ["Sí", "No"]
  schema_columns:
    destino_trabajo: tipo_lugar_destino
    modo_trabajo: modo_principal

arms:
  # In order: a row to impute is scored by the first arm whose `requires` it has observed. `features` lists groups
  # or features; `exclude` removes some.
  with_education:
    features: [person, destination, mobility]
    requires: [escolaridad]
  without_education:
    features: [person, destination, mobility]
    exclude: [escolaridad]

auxiliary:
  # P(feature | x) for the rows whose value of the feature has no training support (workers without a work trip),
  # one model per arm, on the arm's features minus `exclude`.
  destino_trabajo:
    exclude: [destination, modo_trabajo]

selection:
  cv: {splits: 5, seed: 42, test_fold: 0}   # household-grouped, stratified; fold `test_fold` is held out
  rule: one_se
  families:                                 # classifier arguments; `params` is the grid
    LogisticRegression: {max_iter: 2000, params: {C: [0.1, 1.0, 10.0]}}
    RandomForest:
      n_estimators: 500
      n_jobs: -1
      params: {max_leaf_nodes: [25, 50, 100], max_features: [sqrt, 0.7], min_samples_leaf: [1, 5, 10]}
    GradientBoosting:
      native_categoricals: true
      early_stopping: false   # would use a row-level split that ignores households; max_iter is tuned in the grouped CV
      params: {max_iter: [50, 100, 200, 400], learning_rate: [0.05, 0.1], max_leaf_nodes: [15, 31], l2_regularization: [0.0, 1.0]}

evaluation:
  bootstrap: 500
  calibration_bins: 10
  # Weighted profiles of the rows with and without an observed giro (the training population vs the imputed one).
  profiles: [sexo_nacimiento, ocupacion, escolaridad, municipio, estado_civil, parentesco, personas_en_vivienda, n_autos_camionetas]
  # Isotonic recalibration on out-of-fold probabilities: always evaluated on the held-out rows; shipped in the bundle
  # only with `ship: true`.
  isotonic: {ship: false}
  # Covariate-shift sensitivity: the known-giro workers reweighted to the unknown-giro profile (education excluded).
  shift:
    profile: [sexo_nacimiento, edad, municipio, estado_civil, parentesco, personas_en_vivienda, ocupacion, trabajo_semana_pasada]
  delta: {class: gobierno}

outputs:
  prefix: giro

builders:
  giro.destination:
    state_code: 14              # DENUE and census state (Jalisco)
    denue_release: "202211"     # November 2022: the DENUE snapshot closest to (and before) the OD fieldwork of Jan-Apr 2023
    small_establishment_levels: ["0 a 5 personas", "6 a 10 personas"]   # DENUE `per_ocu` strata counted as small
    # DENUE `codigo_act` first two digits (SCIAN sector) -> giro slug, for the establishment-mix shares.
    denue_scian2:
      11: industria    # Agricultura, cría y explotación de animales, aprovechamiento forestal, pesca y caza (primary production)
      21: industria    # Minería
      22: industria    # Generación, transmisión y distribución de energía eléctrica, agua y gas
      23: industria    # Construcción
      31: industria    # Industrias manufactureras
      32: industria    # Industrias manufactureras
      33: industria    # Industrias manufactureras
      43: comercio     # Comercio al por mayor
      46: comercio     # Comercio al por menor
      48: servicio     # Transportes, correos y almacenamiento
      49: servicio     # Transportes, correos y almacenamiento
      51: servicio     # Información en medios masivos
      52: servicio     # Servicios financieros y de seguros
      53: servicio     # Servicios inmobiliarios y de alquiler
      54: servicio     # Servicios profesionales, científicos y técnicos
      55: servicio     # Corporativos
      56: servicio     # Servicios de apoyo a los negocios y manejo de residuos
      61: educacion    # Servicios educativos
      62: servicio     # Servicios de salud y de asistencia social
      71: servicio     # Servicios de esparcimiento culturales y deportivos
      72: servicio     # Servicios de alojamiento temporal y de preparación de alimentos
      81: servicio     # Otros servicios excepto actividades gubernamentales
      93: gobierno     # Actividades legislativas, gubernamentales y de justicia
