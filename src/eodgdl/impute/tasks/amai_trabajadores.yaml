# Imputation task: the AMAI component "members aged 14+ who worked last month (a diagnostic: the EOD counts them from its roster)" for the EOD's dwellings, trained on ENIGH 2022's households
# (source enigh.households, harmonized onto the EOD's labels: impute/harmonization/enigh.yaml). Ported from
# informal-jobs-model's notebook 07, with cars + vans + pickups for the vehicles and the engine's selection. The
# head's education enters as AMAI points: observed in ENIGH; in the chain `nse`, filled from the educacion_jefe task.

task: amai_trabajadores
source: enigh.households
score_source: eod.dwellings
bundle: od_amai_trabajadores_model.joblib

target:
  column: trabajadores_14
  classes: {"0": "0", "1": "1", "2": "2", "3": "3", "4 o más": "4_o_mas"}
  scores: {"0": 0, "1": 15, "2": 31, "3": 46, "4_o_mas": 61}   # AMAI points

missing_label: no_especificado

features:
  builders:
    enigh.households: [harmonize.enigh]
    eod.dwellings: [harmonize.eod_viviendas]
  groups:
    household: [personas_en_vivienda, ingreso_hogar, tiene_internet, n_autos_camionetas, n_motos, n_bicicletas, tenencia_vivienda]
    head: [edad_jefe, sexo_jefe, educacion_jefe_puntos]
  numeric: [edad_jefe, educacion_jefe_puntos]
# Levels: the harmonized ones (impute/harmonization/common.yaml).

arms:
  # The EOD's dwellings without an income answer (58%) are scored by the arm without income.
  con_ingreso:
    features: [household, head]
    requires: [ingreso_hogar]
  sin_ingreso:
    features: [household, head]
    exclude: [ingreso_hogar]

selection:
  # Training households: ENIGH's cities of 100,000+ (tam_loc 1), the closest to a metro area of five million. Decided
  # 2026-09-28 from evaluation.populations: bathrooms' held-out log loss in such cities 0.700 (national 0.710, urban
  # 0.700, Jalisco only 0.788), in Jalisco's 0.658 (0.701, 0.677, 0.711); bedrooms tied except Jalisco only.
  population: {tam_loc: ["1"]}
  cv: {splits: 5, seed: 42, test_fold: 0}
  rule: one_se
  families:
    LogisticRegression: {max_iter: 2000, params: {C: [0.1, 1.0, 10.0]}}
    RandomForest:
      n_estimators: 300
      n_jobs: -1
      params: {max_leaf_nodes: [25, 50, 100], max_features: [sqrt, 0.7], min_samples_leaf: [1, 5, 10]}
    GradientBoosting:
      native_categoricals: true
      early_stopping: false
      params: {max_iter: [50, 100, 200, 400], learning_rate: [0.05, 0.1], max_leaf_nodes: [15, 31], l2_regularization: [0.0, 1.0]}

evaluation:
  bootstrap: 500
  calibration_bins: 10
  isotonic: {ship: false}
  # Which ENIGH households to train on (the metro area is a city of five million): each arm's selected configuration
  # refitted on each population's training rows of the whole ENIGH (its own grouped split), all judged on the same
  # held-out households of large cities. The evidence behind selection.population.
  populations:
    national: {}
    urban: {tam_loc: ["1", "2", "3"]}
    cities_100k: {tam_loc: ["1"]}
    jalisco: {entidad: ["14"]}
  population_tests:
    cities_100k: {tam_loc: ["1"]}
    jalisco_cities_100k: {tam_loc: ["1"], entidad: ["14"]}
  # a diagnostic: the EOD observes this component (its roster), so nothing is imputed and no shift is checked

outputs:
  prefix: amai_trabajadores
