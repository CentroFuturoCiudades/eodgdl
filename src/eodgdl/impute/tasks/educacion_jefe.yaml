# Imputation task: the education of the head of household on AMAI's classes, for the EOD dwellings whose head's
# education is unknown. Trained and scored on the EOD's own dwellings (source eod.dwellings). Ported from
# informal-jobs-model's notebook 06, with the dwelling weight (the notebook used the person weight) and the engine's
# selection. The first step of the chain `nse`.

task: educacion_jefe
source: eod.dwellings
bundle: od_educacion_jefe_model.joblib

target:
  column: educacion_jefe
  classes: {no_estudio: no_estudio, primaria: primaria, secundaria: secundaria, carrera_tecnica: carrera_tecnica,
            preparatoria: preparatoria, licenciatura: licenciatura, posgrado: posgrado}
  scores: {no_estudio: 0, primaria: 11, secundaria: 18, carrera_tecnica: 23, preparatoria: 27, licenciatura: 59, posgrado: 85}   # AMAI points

missing_label: no_especificado

features:
  builders: [harmonize.eod_viviendas, eod.household_education]
  groups:
    head: [edad_jefe, sexo_jefe, estado_civil_jefe]
    dwelling: [personas_en_vivienda, tenencia_vivienda, ingreso_hogar, n_autos_camionetas, tiene_internet]
    # the head's weekend travel and whether they left home yesterday
    travel: [weekend_mode_auto_particular, weekend_mode_camion_autobus, weekend_mode_a_pie, salio_casa_ayer,
             weekend_dest_visitar, weekend_dest_compras_bienes_servicios]
    place: [centralidad]
    # the highest education among the dwelling's other members aged 15+ (eod.household_education): mostly the spouse's
    household: [hogar_escolaridad_max]
  numeric: [edad_jefe, hogar_escolaridad_max]

levels:
  declared:
    weekend_mode_auto_particular: ["Sí", "No"]
    weekend_mode_camion_autobus: ["Sí", "No"]
    weekend_mode_a_pie: ["Sí", "No"]
    weekend_dest_visitar: ["Sí", "No"]
    weekend_dest_compras_bienes_servicios: ["Sí", "No"]
  schema_columns: {estado_civil_jefe: estado_civil}

arms:
  # In order: a dwelling is scored by the first arm whose `requires` it has observed. Since v0.7.0 (2026-09-30) the
  # household's education, where another member answered, is a second source of the head's (paired CV log loss,
  # eodgdl impute compare, three seeds, the bundle's winner: -0.0465, se 0.0020, better on every fold). It is its own
  # arm because its gaps follow the head's: another member's education is unknown for 16% of the heads with a known
  # education and for 53% of those imputed (both weighted), the whole household skipped. One model reading it with the
  # median where missing lost 0.030 on those heads (grouped CV, three seeds); the arm without it is the model as it was.
  # With the arms: -0.059 on the heads whose household answered, nothing elsewhere.
  # Tried and not taken: the dwelling AGEB's census profile and AMAI's NSE by AGEB (builder census.home): -0.0026 and
  # -0.0028 alone, -0.0032 together, -0.0008 beyond the household's education; AMAI's table is also the NSE chain's
  # calibration target and benchmark, which a feature would no longer leave independent.
  con_hogar:
    features: [head, dwelling, travel, place, household]
    requires: [hogar_escolaridad_max]
  sin_hogar:
    features: [head, dwelling, travel, place]

selection:
  cv: {splits: 5, seed: 42, test_fold: 0}
  rule: one_se
  families:
    LogisticRegression: {max_iter: 2000, params: {C: [0.1, 1.0, 10.0]}}
    RandomForest:
      n_estimators: 500
      n_jobs: -1
      params: {max_leaf_nodes: [25, 50, 100], max_features: [sqrt, 0.7], min_samples_leaf: [1, 5, 10]}
    GradientBoosting:
      native_categoricals: true
      early_stopping: false
      params: {max_iter: [50, 100, 200, 400], learning_rate: [0.05, 0.1], max_leaf_nodes: [15, 31], l2_regularization: [0.0, 1.0]}

evaluation:
  bootstrap: 500
  calibration_bins: 10
  profiles: [sexo_jefe, estado_civil_jefe, personas_en_vivienda, ingreso_hogar, n_autos_camionetas, tiene_internet, tenencia_vivienda]
  isotonic: {ship: false}
  shift:
    profile: [edad_jefe, sexo_jefe, estado_civil_jefe, personas_en_vivienda, tenencia_vivienda, ingreso_hogar, n_autos_camionetas, tiene_internet]

outputs:
  prefix: educacion_jefe
