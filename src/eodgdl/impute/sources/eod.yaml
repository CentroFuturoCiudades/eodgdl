# Sources and feature builders on the EOD survey (eodgdl.load_eod), read by eodgdl.impute.sources.eod.

eod.workers:
  # One row per interviewed person who worked last week, with the dwelling's attributes attached.
  keys: [folio_vivienda, folio_habitante]
  weight: ponderador          # the person weight (hab)
  group: folio_vivienda       # CV group: households never straddle two folds
  employed_categories:        # `trabajo_semana_pasada` levels that define a worker
    - Tiempo completo
    - Medio tiempo
    - Tenía trabajo, pero no trabajó
  dwelling_columns: [municipio, ageb, centralidad, personas_en_vivienda, n_autos_camionetas]   # of `viv`, those not in `hab`
  # The source adds `mes_entrevista`, the interview's month: the capture changed through the fieldwork (from April a
  # work trip's destination is an office half as often, reports/loading.qmd #sec-april) and so did the answers.

eod.work_trip:
  # Most frequent destination type, destination code / zone and main mode of each person's work trips.
  purpose: Trabajar           # `motivo_viaje` of the trips whose destination describes the workplace

eod.dwellings:
  # One row per dwelling with its head of household: the reported "Jefe del hogar" (the first, in the survey's order,
  # where a dwelling holds several households), else its oldest member. Ported from informal-jobs-model's notebook 06.
  keys: [folio_vivienda]
  weight: ponderador          # the dwelling weight (viv): the targets are the dwelling's
  group: folio_vivienda
  head_relationship: Jefe del hogar
  # The head's own columns, renamed: sex, age, marital status, education (the education task's target), and the
  # weekend travel and whether they left home yesterday.
  head_columns: {sexo_nacimiento: sexo_jefe, edad: edad_jefe, estado_civil: estado_civil_jefe, escolaridad: escolaridad_jefe, salio_casa_ayer: salio_casa_ayer}
  head_prefixes: [weekend_]
  # Members aged 14+ who worked last week (AMAI counts those who worked last month).
  worker_min_age: 14
  employed_categories: [Tiempo completo, Medio tiempo, Tenía trabajo, pero no trabajó]
