# Sources and feature builders on the EOD survey (eodgdl.load_eod), read by eodgdl.impute.sources.eod.

eod.workers:
  # One row per interviewed person who worked last week, with the dwelling's attributes attached.
  keys: [folio_vivienda, folio_habitante]
  weight: ponderador          # the person weight (hab)
  group: folio_vivienda       # CV group: households never straddle two folds
  employed_categories:        # `trabajo_semana_pasada` levels that define a worker
    - Tiempo completo
    - Medio tiempo
    - Tenía trabajo, pero no trabajó
  dwelling_columns: [municipio, ageb, centralidad, personas_en_vivienda, n_autos_camionetas]   # of `viv`, those not in `hab`
  # The source adds `mes_entrevista`, the interview's month: the capture changed through the fieldwork (from April a
  # work trip's destination is an office half as often, reports/loading.qmd #sec-april) and so did the answers.

eod.persons:
  # One row per interviewed person aged `min_age` or more, with the dwelling's attributes, the interview month and
  # `situacion_laboral` (the employment answer on the employment task's levels; NA where unanswered: 4,370 adults whose
  # socio-economic block was skipped, most in February-April). The training rows of the task `empleo`.
  keys: [folio_vivienda, folio_habitante]
  weight: ponderador
  group: folio_vivienda
  min_age: 16                 # every unanswered person is 16 or older
  dwelling_columns: [municipio, ageb, centralidad, personas_en_vivienda, n_autos_camionetas]
  labour_status:              # slug -> `trabajo_semana_pasada` answers
    trabaja: [Tiempo completo, Medio tiempo, "Tenía trabajo, pero no trabajó"]
    estudiante: [Es estudiante]
    hogar: [Se dedica a los quehaceres del hogar o a cuidar a sus hijos]
    jubilado: [Es jubilado o pensionado]
    sin_trabajo: [No trabajo, Busco trabajo, Está incapacitado permanentemente para trabajar]

eod.labour:
  # The rows the chain `labour` completes: the persons of eod.persons who worked last week or did not answer. Their
  # employment is observed or drawn (task empleo); giro and informality are scored on every row and read only where
  # the person works (reported, or drawn). Feature builders as eod.workers's (`builders_as`).
  keys: [folio_vivienda, folio_habitante]
  weight: ponderador
  group: folio_vivienda
  min_age: 0                  # every worker, as eod.workers (243 are 12-15); the unanswered are all 16+
  dwelling_columns: [municipio, ageb, centralidad, personas_en_vivienda, n_autos_camionetas]
  labour_status:
    trabaja: [Tiempo completo, Medio tiempo, "Tenía trabajo, pero no trabajó"]
    estudiante: [Es estudiante]
    hogar: [Se dedica a los quehaceres del hogar o a cuidar a sus hijos]
    jubilado: [Es jubilado o pensionado]
    sin_trabajo: [No trabajo, Busco trabajo, Está incapacitado permanentemente para trabajar]
  worker_status: trabaja
  builders_as: eod.workers

eod.person_context:
  # The person's survey day (trips, and whether one went to work or to study) and the household around them (the other
  # members aged `min_age`+ by their employment answer, and the children); read by the task empleo.
  work_motive: Trabajar
  school_motive: Estudiar
  min_age: 16
  child_age: 12
  household_roles:            # column -> `trabajo_semana_pasada` answers counted among the other members
    hogar_otros_trabajan: [Tiempo completo, Medio tiempo, "Tenía trabajo, pero no trabajó"]
    hogar_otros_estudian: [Es estudiante]
    hogar_otros_hogar: [Se dedica a los quehaceres del hogar o a cuidar a sus hijos]

eod.work_trip:
  # Most frequent destination type, destination code / zone and main mode of each person's work trips.
  purpose: Trabajar           # `motivo_viaje` of the trips whose destination describes the workplace
  # The destination type and mode of a person who made no work trip on the survey day: null leaves them missing (averaged
  # at scoring); a task that learns from that state names a level (giro: sin_viaje) and declares it (levels.extra).
  no_trip: null

eod.dwellings:
  # One row per dwelling with its head of household: the reported "Jefe del hogar" (the first, in the survey's order,
  # where a dwelling holds several households), else its oldest member. Ported from informal-jobs-model's notebook 06.
  keys: [folio_vivienda]
  weight: ponderador          # the dwelling weight (viv): the targets are the dwelling's
  group: folio_vivienda
  head_relationship: Jefe del hogar
  # The head's own columns, renamed: sex, age, marital status, education (the education task's target), and the
  # weekend travel and whether they left home yesterday.
  head_columns: {sexo_nacimiento: sexo_jefe, edad: edad_jefe, estado_civil: estado_civil_jefe, escolaridad: escolaridad_jefe, salio_casa_ayer: salio_casa_ayer}
  head_prefixes: [weekend_]
  # Members aged 14+ who worked last week (AMAI counts those who worked last month).
  worker_min_age: 14
  employed_categories:        # block style: a flow list splits "Tenía trabajo, pero no trabajó" at its comma (until 2026-09-29)
    - Tiempo completo
    - Medio tiempo
    - Tenía trabajo, pero no trabajó

eod.household_education:
  # The highest education among the other members of the dwelling (for a worker: everyone else; for a dwelling: all but
  # the head). An unknown answer (missing, "No sabe") does not count.
  min_age: 15
  years:                      # years of schooling of each `escolaridad` answer (INEGI's usual equivalence)
    Ninguno: 0
    Kinder: 0
    Preescolar: 0
    Primaria: 6
    Secundaria: 9
    Carrera técnica con secundaria terminada: 11
    Normal básica: 12
    Preparatoria o bachillerato: 12
    Carrera técnica con preparatoria terminada: 14
    Licenciatura o profesional: 16
    Maestría o doctorado: 19
