[project]
name = "eodgdl"
version = "0.10.0"
description = "IMEPLAN Guadalajara EOD 2023 origin-destination survey: the research pipeline from the shipped survey to the TASHA tables"
readme = "README.md"
authors = [
    { name = "Gonzalo Peraza", email = "ggperaza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.2",
    "numpy>=2.0",
    "pandas>=3.0.0",
    "pandera>=0.29.0",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# Extra for running the bundled exploratory notebooks. TAZ.ipynb cross-analyses the EOD
# zone system against the census, so it pulls in mxcensus (fetches census data on demand).
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.1.1",
    "matplotlib>=3.10",
    "mapclassify>=2.10",
    "folium>=0.20",
    "seaborn>=0.13",
    "colorcet>=3.1",
    "mxcensus>=0.1.0",
]
# Extra for eodgdl.reweight: the census targets come from INEGI through mxcensus; the records' imputed employment
# scores an eodgdl.impute bundle (scikit-learn, at the version the bundles were fitted under).
reweight = [
    "mxcensus>=0.4.0",
    "scikit-learn>=1.9.0",
    "joblib>=1.5",
]
# Extra for the imputation engine (eodgdl.impute) and the giro model on it (eodgdl.giro): scikit-learn pipelines,
# DENUE and the census (for the zone system's units) through mxcensus.
giro = [
    "scikit-learn>=1.9.0",
    "joblib>=1.5",
    "pyyaml>=6.0",
    "mxcensus>=0.4.0",
    "openpyxl>=3.1",   # AMAI's NSE by AGEB (xlsx) for the chain `nse`
]
dev = ["pytest>=8.0"]
# Extra for the workflow (workflow/Snakefile): Snakemake, and every extra a rule needs.
workflow = [
    "eodgdl[giro,reweight]",
    "matplotlib>=3.10",   # the zone_system rule's maps and the reports' figures
    "ipykernel>=7.3",     # the reports: Quarto runs them through a Jupyter kernel (Quarto itself is installed apart)
    "nbclient>=0.11",
    "snakemake>=9",
]

[project.scripts]
eodgdl = "eodgdl._cli:main"

[tool.uv.sources]
mxcensus = { git = "https://github.com/CentroFuturoCiudades/mxcensus.git", rev = "v0.4.0" }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = [
    "RUF022",
]
