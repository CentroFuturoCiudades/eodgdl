[project]
name = "eodgdl"
version = "0.1.0"
description = "IMEPLAN Guadalajara EOD 2023 origin-destination survey: loader, schemas, and TAZ zone tools"
readme = "README.md"
authors = [
    { name = "Gonzalo Peraza", email = "ggperaza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.2",
    "numpy>=2.0",
    "pandas>=3.0.0",
    "pandera>=0.29.0",
    "pyarrow>=18.0",
    "pooch>=1.8",
    "platformdirs>=4.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# Extra for running the bundled exploratory notebooks. TAZ.ipynb cross-analyses the EOD
# zone system against the census, so it pulls in mxcensus (fetches census data on demand).
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.1.1",
    "matplotlib>=3.10",
    "mapclassify>=2.10",
    "folium>=0.20",
    "seaborn>=0.13",
    "colorcet>=3.1",
    "mxcensus>=0.1.0",
]
# Extra for the giro-imputation model (eodgdl.giro): scikit-learn pipelines, DENUE and the Marco
# Geoestadístico through mxcensus.
giro = [
    "scikit-learn>=1.9.0",
    "joblib>=1.5",
    "pyyaml>=6.0",
    "mxcensus>=0.2.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
eodgdl = "eodgdl._cli:main"

[tool.uv.sources]
mxcensus = { git = "https://github.com/CentroFuturoCiudades/mxcensus.git", rev = "v0.2.0" }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
